name: Nightly database backup

on:
  schedule:
    - cron: '30 21 * * *' # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dump and encrypt
        env:
          # Plain database password only; host and user are fixed below (Session pooler, IPv4)
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PGPASSWORD" || { echo "SUPABASE_DB_PASSWORD secret missing"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE secret missing"; exit 1; }
          stamp=$(date -u +%Y-%m-%dT%H%M)
          docker run --rm -e PGPASSWORD postgres:17 \
            pg_dump -h aws-1-ap-northeast-1.pooler.supabase.com -p 5432 -U postgres.oaqdmffxgqjnpfdqejtf -d postgres \
            --format=custom --no-owner --no-privileges --schema=public --schema=auth > db.dump
          test -s db.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "marginmart-$stamp.dump.gpg" db.dump
          rm db.dump
          ls -lh marginmart-*.dump.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: marginmart-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
