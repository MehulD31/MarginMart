name: senddoc
# Turn a markdown file in the repo into a PDF (docs/make-brief-pdf.mjs) and send it to the KD Telegram group.
# Started by hand / by an agent: gh workflow run senddoc.yml -f file=docs/orders/x.md -f caption="..."
on:
  workflow_dispatch:
    inputs:
      file: { description: "markdown file in the repo, e.g. docs/orders/order.md", required: true }
      caption: { description: "Telegram caption", required: false, default: "" }
      landscape: { description: "1 = A4 landscape", required: false, default: "" }
permissions: { contents: read }
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "docs", sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Chromium
        run: |
          npm i --no-save --no-package-lock @playwright/test@1.59.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Make and send the PDF
        env:
          FILE: ${{ github.event.inputs.file }}
          CAPTION: ${{ github.event.inputs.caption }}
          LANDSCAPE: ${{ github.event.inputs.landscape }}
          KD_BOT_TOKEN: ${{ secrets.KD_BOT_TOKEN }}
          KD_CHAT_ID: ${{ secrets.KD_CHAT_ID }}
        run: |
          case "$FILE" in docs/*.md) ;; *) echo "file must be docs/*.md"; exit 1 ;; esac
          node docs/make-brief-pdf.mjs "$FILE" $([ "$LANDSCAPE" = 1 ] && echo landscape)
          PDF="${FILE%.md}.pdf"
          r=$(curl -s -X POST "https://api.telegram.org/bot${KD_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${KD_CHAT_ID}" -F "caption=${CAPTION}" -F "document=@${PDF}")
          echo "$r" | grep -q '"ok":true' || { echo "telegram: ${r:0:200}"; exit 1; }
          echo "sent $PDF"
      - name: Tell the KD group if this failed
        if: failure()
        env:
          KD_BOT_TOKEN: ${{ secrets.KD_BOT_TOKEN }}
          KD_CHAT_ID: ${{ secrets.KD_CHAT_ID }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${KD_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${KD_CHAT_ID}" \
            --data-urlencode "text=⚠️ PDF Telegram pe nahi gaya. Details: ${URL}" > /dev/null
