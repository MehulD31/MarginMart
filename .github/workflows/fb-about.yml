name: fb-about
# One-off: put the WhatsApp community link on the MarginMart Facebook page. Run by hand (workflow_dispatch).
on: workflow_dispatch
jobs:
  about:
    runs-on: ubuntu-latest
    steps:
      - name: Update page About
        env:
          TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          PAGE: ${{ secrets.FB_PAGE_ID }}
        run: |
          ABOUT="by K.D. Foods · Wholesale distributor · Bhilai. Drinks, water, milk drinks & more. WhatsApp group: https://chat.whatsapp.com/DrCMzkTTp4Q8ozaXZ4KIXm · Call 9630012636"
          curl -sS -X POST "https://graph.facebook.com/v21.0/$PAGE" --data-urlencode "about=$ABOUT" --data-urlencode "access_token=$TOKEN" | grep -v access_token
          echo
          curl -sS "https://graph.facebook.com/v21.0/$PAGE?fields=about&access_token=$TOKEN"
