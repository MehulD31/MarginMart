name: content
# Daily social content (scripts/ops/content.mjs): new purchases -> "माल आ गया" poster -> social queue + preview in the KD group.
# 18:00 IST, before the 19:30 social post. Idempotent (one post per purchase), so extra triggers are harmless.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'   # 18:00 IST
concurrency: { group: content, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: |
          npm i --no-save --no-package-lock @playwright/test@1.59.1
          npx playwright install --with-deps chromium
      - env:
          KD_BOT_TOKEN: ${{ secrets.KD_BOT_TOKEN }}
          KD_CHAT_ID: ${{ secrets.KD_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ops/content.mjs
      - name: Tell Telegram
        if: failure()
        env:
          KD_BOT_TOKEN: ${{ secrets.KD_BOT_TOKEN }}
          KD_CHAT_ID: ${{ secrets.KD_CHAT_ID }}
        run: curl -s "https://api.telegram.org/bot${KD_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${KD_CHAT_ID}" --data-urlencode "text=⚠️ Content job fail hua (stock poster). ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
