name: ops
# KD Foods autopilot (scripts/ops/ops.mjs). Every mode is idempotent (public.ops_log), so a double trigger never sends twice.
# Triggers: cron-job.org -> workflow_dispatch (exact times, preferred) AND the GitHub schedule below as a fallback
# (GitHub runs late; the watchdog re-sends anything still missing and alerts if the 10-minute poller stops).
on:
  workflow_dispatch:
    inputs:
      mode: { description: "morning | night | weekly | events | month | watchdog | social | ask | media | ads", required: true, default: watchdog }
      question: { description: "for mode=ask", required: false, default: "" }
      force: { description: "1 = send again even if already sent", required: false, default: "" }
      file: { description: "mode=media: Telegram file_id of the video/photo", required: false, default: "" }
      mtype: { description: "mode=media: video | image", required: false, default: "" }
      note: { description: "mode=media: what the owner wrote with it", required: false, default: "" }
      who: { description: "mode=media: who sent it", required: false, default: "" }
      post: { description: "mode=social: post this social_post id now", required: false, default: "" }
  schedule:
    - cron: '30 2 * * *'    # 08:00 IST morning
    - cron: '0 16 * * *'    # 21:30 IST night
    - cron: '30 3 * * 1'    # Mon 09:00 IST weekly
    - cron: '*/10 * * * *'  # events (join requests, shop orders, stock-outs, website)
    - cron: '0 4 1 * *'     # 1st, 09:30 IST month file
    - cron: '30 4 * * *'    # 10:00 IST watchdog
    - cron: '30 17 * * *'   # 23:00 IST watchdog
    - cron: '0 14 * * *'    # 19:30 IST social
concurrency: { group: "ops-${{ github.event.inputs.mode || github.event.schedule }}-${{ github.event.inputs.file || github.event.inputs.post }}", cancel-in-progress: false }
permissions: { contents: read, actions: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "scripts/ops\nscripts/scheme-bot/lib.mjs\nsrc/shared/insights.js", sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Pick mode
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            '30 2 * * *') m=morning ;; '0 16 * * *') m=night ;; '30 3 * * 1') m=weekly ;;
            '*/10 * * * *') m=events ;; '0 4 1 * *') m=month ;;
            '30 4 * * *'|'30 17 * * *') m=watchdog ;; '0 14 * * *') m=social ;;
            *) m="${{ github.event.inputs.mode }}" ;;
          esac
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - name: Run
        env:
          MODE: ${{ steps.m.outputs.mode }}
          QUESTION: ${{ github.event.inputs.question }}
          FORCE: ${{ github.event.inputs.force }}
          FILE_ID: ${{ github.event.inputs.file }}
          MTYPE: ${{ github.event.inputs.mtype }}
          NOTE: ${{ github.event.inputs.note }}
          WHO: ${{ github.event.inputs.who }}
          POST_ID: ${{ github.event.inputs.post }}
          KD_BOT_TOKEN: ${{ secrets.KD_BOT_TOKEN }}
          KD_CHAT_ID: ${{ secrets.KD_CHAT_ID }}
          KD_CHANNEL_ID: ${{ secrets.KD_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ops/ops.mjs
      # Alarm that works even when the script itself cannot start (8-11 Nov 2026: a missing file broke every run silently).
      - name: Tell the KD group if this run failed
        if: failure() && steps.m.outputs.mode != 'events'
        env:
          KD_BOT_TOKEN: ${{ secrets.KD_BOT_TOKEN }}
          KD_CHAT_ID: ${{ secrets.KD_CHAT_ID }}
          MODE: ${{ steps.m.outputs.mode }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${KD_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${KD_CHAT_ID}" \
            --data-urlencode "text=⚠️ Autopilot job '${MODE}' fail ho gaya. Report/alert nahi gaya. Details: ${URL}" > /dev/null
