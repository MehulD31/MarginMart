name: ads-existing
# One-off check: which Meta app is behind our posting key, which app published the Nayi Gaadi post, and that app's mode.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      PAGE: ${{ secrets.FB_PAGE_ID }}
    steps:
      - name: Facts
        run: |
          G=https://graph.facebook.com/v23.0
          clean() { sed -E 's/"(access_token|token)":"[^"]*"/"\1":"***"/g'; echo; }
          echo "== posting key"; curl -sS "$G/debug_token?input_token=$TOKEN&access_token=$TOKEN" | python3 -c 'import json,sys; d=json.load(sys.stdin).get("data",{}); print({k:d.get(k) for k in ("app_id","application","type","is_valid","scopes","expires_at")})'
          APP=$(curl -sS "$G/debug_token?input_token=$TOKEN&access_token=$TOKEN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["app_id"])')
          echo "== that app"; curl -sS "$G/$APP?fields=id,name,link,namespace&access_token=$TOKEN" | clean
          echo "== Nayi Gaadi FB post: published by which app"; curl -sS "$G/${PAGE}_122096101695552423?fields=id,application,created_time&access_token=$TOKEN" | clean
          echo "== latest page posts and their apps"; curl -sS "$G/$PAGE/posts?fields=id,application,created_time&limit=5&access_token=$TOKEN" | python3 -c 'import json,sys; [print(p["id"][-12:], p.get("created_time"), p.get("application")) for p in json.load(sys.stdin).get("data",[])]'
