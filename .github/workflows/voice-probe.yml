name: voice-probe
# Temporary: check VoiceStudio (github.com/debpalash/voicestudio) on a GitHub runner (CPU) for Hinglish voiceovers.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Start VoiceStudio (CPU)
        run: |
          df -h / | tail -1
          time docker pull -q ghcr.io/debpalash/voicestudio:stable
          docker images ghcr.io/debpalash/voicestudio --format '{{.Size}}'
          docker run -d --name vs -p 3900:3900 -e OMNIVOICE_API_KEY=probe ghcr.io/debpalash/voicestudio:stable
          for i in $(seq 1 90); do curl -fsS localhost:3900/health >/dev/null 2>&1 && break; sleep 5; done
          curl -sS localhost:3900/health; echo
      - name: API
        run: |
          H='Authorization: Bearer probe'
          curl -sS -H "$H" localhost:3900/openapi.json -o openapi.json
          python3 - <<'EOF'
          import json; d = json.load(open('openapi.json'))
          for p, v in d['paths'].items():
              if any(k in p for k in ('speech', 'generate', 'tts', 'voice', 'models', 'design')): print(p, list(v))
          for name in ('/v1/audio/speech',):
              op = d['paths'].get(name, {}).get('post', {})
              ref = json.dumps(op.get('requestBody', {}))[:600]; print(name, ref)
          sch = d.get('components', {}).get('schemas', {})
          for k, v in sch.items():
              if 'speech' in k.lower() or 'tts' in k.lower() or 'generate' in k.lower(): print(k, json.dumps(v.get('properties', {}))[:1500])
          EOF
          curl -sS -H "$H" localhost:3900/v1/models | head -c 1500; echo
      - name: Generate Hinglish
        run: |
          H='Authorization: Bearer probe'
          for body in \
            '{"model":"omnivoice","input":"MarginMart ki nayi gaadi aa gayi! Ab Bhilai ki har dukaan tak roz delivery.","response_format":"wav","instructions":"male, middle-aged, indian accent"}' \
            '{"input":"MarginMart ki nayi gaadi aa gayi! Ab Bhilai ki har dukaan tak roz delivery.","response_format":"wav"}'; do
            start=$(date +%s)
            code=$(curl -sS -o out.wav -w '%{http_code}' -H "$H" -H 'Content-Type: application/json' -d "$body" localhost:3900/v1/audio/speech --max-time 900)
            echo "status $code in $(( $(date +%s) - start )) s"; file out.wav; head -c 300 out.wav | strings | head -3
            [ "$code" = 200 ] && break
          done
          docker logs vs 2>&1 | tail -25
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: voice-probe, path: "*.wav" }
