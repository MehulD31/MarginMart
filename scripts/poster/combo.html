<!doctype html>
<!-- K.D. Foods combo poster, 1080x1350: "buy X of A, get Y of B free". Data via ?d=<base64 JSON>, see render.mjs.
     Never shows our selling price. All text comes from data, so numbers are exact. -->
<html lang="hi"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mukta:wght@500;700;800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: 'Mukta', sans-serif; color: #fff; position: relative;
    background: radial-gradient(1200px 800px at 50% 40%, #1f6fe0 0%, #0a3fa8 45%, #062a73 100%); }
  .rays { position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 50% 44%, rgba(255,255,255,.07) 0 6deg, transparent 6deg 18deg); }
  header { position: absolute; top: 44px; left: 56px; right: 56px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: 'Baloo 2'; font-weight: 800; font-size: 40px; }
  .mark { width: 64px; height: 64px; border-radius: 16px; background: #fff; color: #0a3fa8; display: grid; place-items: center; font-size: 30px; }
  .tag { background: #e4002b; padding: 10px 26px; border-radius: 999px; font-weight: 800; font-size: 30px; box-shadow: 0 6px 0 #9b001d; }
  .headline { position: absolute; top: 150px; left: 40px; right: 40px; text-align: center; font-family: 'Baloo 2'; font-weight: 800; font-size: 92px; line-height: 1.05; text-shadow: 0 5px 0 rgba(0,0,0,.28); }
  .headline em { font-style: normal; color: #ffd200; }
  .row { position: absolute; top: 400px; left: 40px; right: 40px; height: 560px; display: flex; align-items: center; justify-content: space-between; }
  .card { width: 440px; height: 540px; background: #fff; border-radius: 40px; color: #062a73; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 20px 26px; box-shadow: 0 22px 50px rgba(0,0,0,.4); }
  .card img { height: 330px; width: 100%; object-fit: contain; mix-blend-mode: multiply; filter: brightness(1.1) contrast(1.15) saturate(1.1); margin-bottom: 8px; }
  .qty { position: absolute; top: -34px; left: 50%; transform: translateX(-50%); background: #ffd200; color: #062a73; border-radius: 28px; padding: 2px 34px 8px; font-family: 'Baloo 2'; font-weight: 800; font-size: 104px; line-height: 1.1; white-space: nowrap; box-shadow: 0 9px 0 #c79f00; }
  .qty small { font-size: 52px; margin-left: 10px; }
  .name { font-family: 'Baloo 2'; font-weight: 800; font-size: 44px; line-height: 1; }
  .plus { width: 90px; text-align: center; font-family: 'Baloo 2'; font-weight: 800; font-size: 130px; line-height: 1; color: #ffd200; text-shadow: 0 6px 0 rgba(0,0,0,.3); }
  .free { position: absolute; right: -26px; top: 90px; width: 190px; height: 190px; border-radius: 50%; background: #e4002b; color: #fff; display: grid; place-items: center; transform: rotate(14deg);
    font-family: 'Baloo 2'; font-weight: 800; font-size: 62px; line-height: .95; text-align: center; box-shadow: 0 10px 0 #9b001d, 0 18px 30px rgba(0,0,0,.35); border: 6px solid #fff; }
  .free span { display: block; font-size: 34px; font-weight: 600; }
  .value { position: absolute; top: 1000px; left: 56px; right: 56px; text-align: center; background: #25a244; border-radius: 30px; padding: 16px 20px 22px; box-shadow: 0 9px 0 #187a31; font-family: 'Baloo 2'; font-weight: 800; font-size: 54px; line-height: 1.1; }
  .value small { display: block; font-family: 'Mukta'; font-weight: 700; font-size: 28px; opacity: .95; margin-top: 4px; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 200px; background: #fff; color: #062a73; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; }
  .valid { font-weight: 800; font-size: 38px; line-height: 1.1; }
  .valid span { display: block; font-weight: 500; font-size: 28px; color: #4a5a7a; }
  .call { background: #25a244; color: #fff; border-radius: 22px; padding: 18px 30px; font-weight: 800; font-size: 46px; box-shadow: 0 8px 0 #187a31; }
  .call span { display: block; font-size: 24px; font-weight: 700; opacity: .9; }
</style></head>
<body>
  <div class="rays"></div>
  <header><div class="brand"><div class="mark">KD</div>K.D. Foods</div><div class="tag" id="tag"></div></header>
  <div class="headline" id="headline"></div>
  <div class="row">
    <div class="card"><div class="qty" id="bq"></div><img id="bi" alt=""><div class="name" id="bn"></div></div>
    <div class="plus">+</div>
    <div class="card"><div class="qty" id="fq"></div><div class="free" id="free"></div><img id="fi" alt=""><div class="name" id="fn"></div></div>
  </div>
  <div class="value" id="value"></div>
  <div class="foot"><div class="valid" id="valid"></div><div class="call" id="call"></div></div>
<script>
  const d = JSON.parse(decodeURIComponent(escape(atob(new URLSearchParams(location.search).get('d') || 'e30='))))
  const $ = (id) => document.getElementById(id)
  $('tag').textContent = d.tag || 'कॉम्बो ऑफ़र'
  $('headline').innerHTML = d.headline || ''
  $('bq').innerHTML = `${d.buyQty}<small>${d.buyUnit}</small>`
  $('fq').innerHTML = `${d.freeQty}<small>${d.freeUnit}</small>`
  $('bn').textContent = d.buyName; $('fn').textContent = d.freeName
  $('bi').src = d.buyImg; $('fi').src = d.freeImg
  $('free').innerHTML = `फ़्री<span>FREE</span>`
  $('value').innerHTML = `${d.valueLine || ''}<small>${d.valueSub || ''}</small>`
  $('valid').innerHTML = `${d.valid || ''}<span>${d.validSub || ''}</span>`
  $('call').innerHTML = `${d.phone || '96300 12636'}<span>ऑर्डर के लिए कॉल / WhatsApp</span>`
</script>
</body></html>
