<!doctype html><html><head><meta charset="utf-8"><style>
/* MarginMart Reel template, three editing styles (punch / story / frame). Deterministic: everything is computed from t
   inside window.seek(t), no CSS animations or timers. The plan comes from reel.mjs via window.init(plan, which).
   Text stays in Instagram's safe area: below 250 px, above 1520 px, left of 930 px. */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Poppins,sans-serif;--ac:#3ddc6a}
.layer{position:absolute;inset:0;overflow:hidden;will-change:transform}
.layer img{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;transform-origin:50% 50%}
.grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
/* frame style: footage sits in a rounded card on a dark field */
body.frame #stage{background:radial-gradient(ellipse 90% 70% at 50% 40%,#16261d,#070d0a 75%)}
body.frame .layer{left:90px;top:300px;width:900px;height:1180px;border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
body.frame .layer img{left:-90px;top:-300px}
body.frame .grad{background:linear-gradient(180deg,rgba(0,0,0,.35) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 50%,rgba(0,0,0,.82) 100%)}
#stage{position:absolute;inset:0}
#cards{position:absolute;inset:0;isolation:isolate}
.card{position:absolute;left:70px;right:170px;top:330px}
body.punch #cards .card::before,body.story #cards .card.top::before{content:'';position:absolute;left:-200px;top:-260px;width:1100px;height:1000px;z-index:-1;background:radial-gradient(ellipse 50% 45% at 35% 45%,rgba(0,0,0,.62),rgba(0,0,0,0) 72%)}
.line{overflow:hidden;line-height:1.04}
.line span{display:inline-block}
.k{font-size:46px;font-weight:700;color:#fff;letter-spacing:.5px}
.big{font-size:128px;font-weight:900;color:#fff;letter-spacing:-3px;text-shadow:0 4px 0 rgba(0,0,0,.35),0 6px 30px rgba(0,0,0,.6)}
.mid{font-size:88px;font-weight:900;color:#fff;letter-spacing:-2px;text-shadow:0 4px 0 rgba(0,0,0,.35),0 6px 30px rgba(0,0,0,.6)}
.ac{color:var(--ac)}.y{color:#ffd23f}
.bar{height:10px;background:var(--ac);border-radius:6px;margin-top:22px;transform-origin:0 50%}
.chips{display:flex;flex-wrap:wrap;gap:16px;margin-top:28px}
.chip{background:#fff;color:#0b3d20;font-weight:800;font-size:40px;padding:10px 26px;border-radius:50px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
/* story: small label at the top, karaoke subtitles at the bottom */
.pill{display:inline-block;background:var(--ac);color:#111;font-weight:800;font-size:48px;padding:8px 28px;border-radius:14px}
#subs{position:absolute;left:70px;right:150px;top:1240px;height:270px;display:flex;align-items:flex-end;justify-content:center;text-align:center}
#subs .s{font-size:70px;font-weight:900;line-height:1.12;color:#fff;letter-spacing:-1px;text-shadow:0 0 2px #000,0 4px 0 rgba(0,0,0,.55),0 8px 28px rgba(0,0,0,.75)}
#subs .w{display:inline-block;margin:0 .14em}
#subs .on{color:var(--ac)}
/* frame: number badge, headline at the bottom of the card, progress line on top */
.num{position:absolute;left:130px;top:340px;width:120px;height:120px;border-radius:60px;background:var(--ac);color:#111;font-size:56px;font-weight:900;display:flex;align-items:center;justify-content:center}
.fcard{position:absolute;left:130px;right:170px;bottom:470px}
.fchips{position:absolute;left:280px;right:170px;top:352px;display:flex;flex-wrap:wrap;gap:12px}
.fchips .chip{font-size:34px;padding:8px 22px}
#prog{position:absolute;left:90px;top:262px;width:900px;height:8px;border-radius:4px;background:rgba(255,255,255,.18);display:none}
#prog i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ac)}
body.frame #prog{display:block}
#flood{position:absolute;inset:0}
#end{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 80px}
#end img.logo{width:600px}
#end .cta{font-size:44px;font-weight:700;margin-top:40px}
#end .sub{font-size:36px;color:#c9d1d9;margin-top:24px}
#end .follow{margin-top:40px;background:var(--ac);color:#111;font-weight:900;font-size:50px;padding:14px 46px;border-radius:60px}
#end .cm{margin-top:34px;font-size:64px;font-weight:800;line-height:1.1}
#end .cm b{color:#ffd23f;font-weight:900;border:5px solid #ffd23f;border-radius:18px;padding:0 18px;margin-left:6px}
#end .qrb{background:#fff;padding:22px;border-radius:30px;border:8px solid var(--ac);margin-top:36px}
#end .qrb img{width:400px;height:400px;display:block;image-rendering:pixelated}
</style></head><body>
<div id="stage"><div class="layer" id="LB"><img id="B"><div class="grad"></div></div><div class="layer" id="LA"><img id="A"><div class="grad"></div></div></div>
<div id="prog"><i></i></div>
<div id="cards"></div>
<div id="subs"></div>
<div id="flood"></div>
<div id="end"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3)            // ease-out, no bounce
const inout = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const $ = (id) => document.getElementById(id)
let P, END = 'ig', ST = 'punch', built = -1, cardEl = null, subKey = ''
const A = $('A'), B = $('B'), LA = $('LA'), LB = $('LB'), cards = $('cards'), subs = $('subs'), flood = $('flood'), end = $('end'), prog = $('prog').firstChild
const TR = { punch: 0, story: 0.32, frame: 0.4 }                // transition length into each shot

function hookHtml(s, ac = 'ac') {
  return `<div class="line"><span class="k">${esc(s.small)}</span></div><div class="line"><span class="big">${esc(s.a)}</span></div><div class="line"><span class="big ${ac}">${esc(s.b)}</span></div>${s.c ? `<div class="line"><span class="mid">${esc(s.c)}</span></div>` : ''}<div class="bar"></div>`
}
function cardHtml(sh, i) {
  const s = sh.text
  if (ST === 'punch') {
    if (i === 0) return `<div class="card">${hookHtml(s)}</div>`
    return `<div class="card"><div class="line"><span class="mid">${esc(s.a)}</span></div><div class="line"><span class="mid ${i % 2 ? 'y' : 'ac'}">${esc(s.b)}</span></div>` +
      (s.chips?.length ? `<div class="chips">${s.chips.map((c) => `<span class="chip">${esc(c)}</span>`).join('')}</div>` : '<div class="bar"></div>') + '</div>'
  }
  if (ST === 'story') {
    if (i === 0) return `<div class="card top">${hookHtml(s)}</div>`
    return `<div class="card"><div class="line"><span class="pill">${esc(s.a)} ${esc(s.b)}</span></div></div>`
  }
  // frame: numbered list point
  const head = i === 0 ? `<div class="line"><span class="k">${esc(s.small)}</span></div><div class="line"><span class="big">${esc(s.a)}</span></div><div class="line"><span class="big ac">${esc(s.b)}</span></div>`
    : `<div class="line"><span class="mid">${esc(s.a)}</span></div><div class="line"><span class="mid ac">${esc(s.b)}</span></div>`
  const chips = i > 0 && s.chips?.length ? `<div class="fchips">${s.chips.map((c) => `<span class="chip">${esc(c)}</span>`).join('')}</div>` : ''
  return (i > 0 ? `<div class="num"><span>${String(i).padStart(2, '0')}</span></div>` : '') + chips + `<div class="fcard">${head}<div class="bar"></div></div>`
}
window.init = (plan, which) => {
  P = plan; END = which; ST = plan.style || 'punch'; built = -1; subKey = ''
  document.body.className = ST
  document.body.style.setProperty('--ac', plan.accent || '#3ddc6a')
  end.innerHTML = `<img class="logo" src="assets/logo.png">` + (END === 'wa'
    ? `<div class="cta">WhatsApp group join karein</div><div class="qrb"><img src="assets/qr.png"></div><div class="sub">Camera se scan karein · roz ke rate &amp; offers</div><div class="cta" style="margin-top:26px">Call / WhatsApp <span class="y" style="font-weight:900">96300 12636</span></div>`
    : `<div class="follow">+ Follow karein</div><div class="cm">Comment karein <b>RATE</b></div><div class="sub" style="margin-top:14px">rate list aapke DM mein aayegi</div><div class="cta" style="margin-top:44px">Order: <span class="y" style="font-weight:900">96300 12636</span></div>`)
  const bg = { punch: `radial-gradient(ellipse 80% 60% at 50% 45%,#22b552,#0b5a2a 60%,#03200e)`, story: '#0b0b0b', frame: 'var(--ac)' }[ST]
  flood.style.background = bg; flood.innerHTML = ''
}
const frameOf = (s, lt) => `${s.dir}/${String(Math.min(s.n - 1, Math.max(0, Math.floor((s.from + lt * (s.rate ?? 1)) * 30))) + 1).padStart(4, '0')}.jpg`
async function put(el, src) { if (!el.src.endsWith(src)) { el.src = src; await el.decode().catch(() => {}) } }
function cam(el, s, lt, extra = 0) {
  el.style.transformOrigin = `${s.ox}% ${s.oy}%`
  el.style.transform = `scale(${s.z0 + (s.z1 - s.z0) * inout(lt / s.len) + extra})`
}
window.seek = async (t) => {
  const S = P.shots, brandAt = P.brandAt, endAt = P.endAt
  let i = S.length - 1; while (i > 0 && t < S[i].at) i--
  const s = S[i], lt = t - s.at
  if (t < endAt) {
    await put(A, frameOf(s, lt))
    const tr = i > 0 ? TR[ST] : 0, p = tr ? inout(lt / tr) : 1
    if (ST === 'punch') { cam(A, s, lt, i > 0 ? 0.04 * (1 - ease(lt / 0.18)) : 0); LA.style.transform = ''; LB.style.display = 'none' }
    else {
      cam(A, s, lt)
      if (p < 1) {
        const q = S[i - 1]; LB.style.display = ''
        await put(B, frameOf(q, q.len + lt)); cam(B, q, q.len + lt)
        if (ST === 'story') {   // whip push left, motion blur only while moving
          const v = Math.sin(Math.PI * p) * 14
          LB.style.transform = `translateX(${-p * 1080}px)`; LA.style.transform = `translateX(${(1 - p) * 1080}px)`
          LA.style.filter = LB.style.filter = `blur(${v.toFixed(1)}px)`
        } else {                 // frame: new card rises over the old one, the old one sinks back
          LB.style.transform = `scale(${1 - 0.08 * p})`; LB.style.filter = `brightness(${1 - 0.6 * p})`
          LA.style.transform = `translateY(${(1 - p) * 1500}px)`; LA.style.filter = ''
        }
      } else { LB.style.display = 'none'; LA.style.transform = ''; LA.style.filter = '' }
    }
    prog.style.width = `${clamp(t / brandAt) * 100}%`
  }
  // text per shot: masked rise-in after the transition, quick fade out before the cut. The hook is on screen from frame 1.
  const ci = t < brandAt ? i : -1
  if (ci !== built) { cards.innerHTML = ci < 0 ? '' : cardHtml(S[ci], ci); built = ci }
  if (ci >= 0) {
    const c = lt + (ci === 0 ? 0.6 : -(TR[ST] * 0.6)), left = s.len - lt
    cards.querySelectorAll('.line span').forEach((sp, k) => { const q = ease((c - k * 0.12) / 0.38); sp.style.transform = `translateY(${(1 - q) * 105}%)` })
    cards.querySelectorAll('.chip').forEach((ch, k) => { const q = ease((c - 0.45 - k * 0.12) / 0.3); ch.style.opacity = q; ch.style.transform = `translateY(${(1 - q) * 30}px)` })
    const num = cards.querySelector('.num'); if (num) { const q = ease(c / 0.35); num.style.transform = `scale(${q})` }
    const bar = cards.querySelector('.bar'); if (bar) bar.style.transform = `scaleX(${ease((c - 0.35) / 0.5) * 0.45})`
    cards.style.opacity = ci === S.length - 1 ? 1 : clamp(left / 0.15)
  } else cards.style.opacity = 1
  // story: karaoke subtitles of the voice line, 4 words at a time, the spoken word in the accent colour
  let html = ''
  if (ST === 'story' && t < brandAt && s.vo?.text && s.vo.len) {
    const words = s.vo.text.split(' '), chars = words.map((w) => w.length + 1), tot = chars.reduce((a, b) => a + b, 0)
    const pos = (t - s.vo.at) / s.vo.len * tot
    let k = -1, acc = 0; for (let w = 0; w < words.length; w++) { if (pos >= acc) k = w; acc += chars[w] }
    if (t >= s.vo.at - 0.05 && t <= s.vo.at + s.vo.len + 0.35) {
      const g = Math.floor(Math.max(0, k) / 4) * 4
      html = `<div class="s">${words.slice(g, g + 4).map((w, j) => `<span class="w${g + j === k ? ' on' : ''}">${esc(w)}</span>`).join('')}</div>`
    }
  }
  if (html !== subKey) { subs.innerHTML = html; subKey = html }
  // brand card: wipe up, BHILAI / Daily delivery
  const fp = inout((t - brandAt) / 0.35)
  flood.style.clipPath = `inset(${(1 - fp) * 100}% 0 0 0)`
  if (t >= brandAt && t < endAt) {
    const word = ST === 'frame' ? 'color:#111' : ''
    if (!flood.firstChild) flood.innerHTML = `<div class="card" style="top:640px"><div class="line"><span class="k" style="${word}">${esc(P.brand.small)}</span></div><div class="line"><span class="big" style="${word};text-shadow:none">BHILAI</span></div><div class="line"><span class="mid ${ST === 'frame' ? '' : 'y'}" style="${ST === 'frame' ? 'color:#fff;text-shadow:none' : ''}">${esc(P.brand.b)}</span></div><div class="bar" style="background:${ST === 'frame' ? '#111' : '#ffd23f'}"></div></div>`
    flood.querySelectorAll('.line span').forEach((sp, k) => { const q = ease((t - brandAt - 0.25 - k * 0.12) / 0.38); sp.style.transform = `translateY(${(1 - q) * 105}%)` })
    flood.querySelector('.bar').style.transform = `scaleX(${ease((t - brandAt - 0.6) / 0.5) * 0.5})`
  } else flood.innerHTML = ''
  // end card: circle opens, logo + call to action
  end.style.clipPath = `circle(${inout((t - endAt) / 0.3) * 120}% at 50% 50%)`
  ;[...end.children].forEach((k, n) => { const q = ease((t - endAt - 0.15 - n * 0.12) / 0.4); k.style.opacity = q; k.style.transform = `translateY(${(1 - q) * 40}px)` })
}
</script></body></html>
